# The plugin version. This is the single source of truth: Gradle picks it up
# automatically, processResources expands it into paper-plugin.yml, and Minotaur
# uses it as the Modrinth version number.
#
# release-please rewrites the value inside the block below when a release PR is
# merged -- do not bump it by hand.
# x-release-please-start-version
version=0.0.0
# x-release-please-end

# Minecraft versions declared on the Modrinth release page. Kept in sync with
# BedrockDialog's supported versions, since it is a hard dependency.
modrinth.gameVersions=1.21.8,1.21.9,1.21.10,1.21.11,26.1,26.1.1,26.1.2,26.2
